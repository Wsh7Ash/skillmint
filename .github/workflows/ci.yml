name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Lint the example corpus (valid + intentionally broken)
        run: |
          export PYTHONPATH=src
          python -m skillmint lint examples/skills --format text || test $? -eq 1
